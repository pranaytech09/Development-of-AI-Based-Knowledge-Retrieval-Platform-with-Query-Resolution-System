services:
  postgres:
    image: postgres:16-alpine
    container_name: query-resolution-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AI-QUERY-SYSTEM
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: query-resolution-chroma
    # Port 6334 avoids clashing with other local Chroma servers on 6333.
    ports:
      - "6334:8000"
    volumes:
      - chroma-data:/data
      - ./docker/chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres

volumes:
  postgres-data:
  chroma-data:
